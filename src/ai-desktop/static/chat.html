<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><link rel="stylesheet" href="fonts/remixicon.css"><link rel="stylesheet" href="style.css"><title>AI 助手</title></head>
<body class="chat">
  <header class="cbar">
    <div class="brand"><span class="logo"><i class="ri-sparkling-2-fill"></i></span><div><div class="ctitle">AI 助手</div><span id="model" class="model">…</span></div></div>
    <div class="cacts">
      <button id="pin" class="tb" title="置顶"><i class="ri-pushpin-line"></i></button>
      <button id="clear" class="tb" title="新对话"><i class="ri-chat-new-line"></i></button>
      <button id="settings" class="tb" title="AI 设置"><i class="ri-settings-3-line"></i></button>
      <span class="sep"></span>
      <button id="min" class="tb" title="最小化"><i class="ri-subtract-line"></i></button>
      <button id="close" class="tb close" title="关闭 (Esc)"><i class="ri-close-line"></i></button>
    </div>
  </header>
  <main id="log" class="log"></main>
  <footer class="composer-wrap">
    <div class="composer">
      <button id="file" class="tb" title="总结文件（txt / pdf / docx）"><i class="ri-attachment-2"></i></button>
      <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" class="send" title="发送（Enter）"><i class="ri-send-plane-2-fill"></i></button>
    </div>
    <div class="hint-line">AI 生成内容仅供参考 · 文件仅在你主动总结时发送</div>
  </footer>
  <script src="chat.js"></script>
</body></html>
